name: Replace Fantom source with official 9Router

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  replace-source:
    if: github.event.issue.title == '[replace-with-9router]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Fantom repository
        uses: actions/checkout@v4
        with:
          repository: mojitex/fantom
          ref: main
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Check out pinned official 9Router source
        uses: actions/checkout@v4
        with:
          repository: decolua/9router
          ref: 1fe586bb1cf35e1ed0cb2150a8ef7d1db040b21d
          path: upstream
          fetch-depth: 1

      - name: Replace all tracked and untracked project content
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a --delete --exclude='.git' upstream/ repo/
          test -f repo/package.json
          test -f repo/LICENSE
          test -f repo/Dockerfile
          test -f repo/custom-server.js
          test "$(node -p "require('./repo/package.json').version")" = "0.5.112"
          test ! -e repo/go.mod
          echo "Verified official 9Router v0.5.112 source tree."

      - name: Commit complete replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Replace Fantom with official 9Router v0.5.112"
          git push origin HEAD:main

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            -d '{"state":"closed","state_reason":"completed"}'
