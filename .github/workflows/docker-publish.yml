name: Test and publish Fantom

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.mod
      - name: Resolve Go module graph and checksums
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...

  smoke:
    name: Build and smoke-test container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: monsmain/fantom:ci-test
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max
      - name: Test container startup, health, auth and dashboard
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name fantom-smoke \
            -p 127.0.0.1:18080:8080 \
            -e GATEWAY_API_KEY=ci-only-test-key \
            monsmain/fantom:ci-test
          trap 'docker rm -f fantom-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' fantom-smoke 2>/dev/null || true)" != "true" ]]; then
              docker logs fantom-smoke || true
              echo "Fantom container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/ | grep -qi 'FANTOM'

          code="$(curl -sS -o /tmp/fantom-unauthorized.json -w '%{http_code}' http://127.0.0.1:18080/v1/models)"
          [[ "$code" == "401" ]]

          curl -fsS -H 'Authorization: Bearer ci-only-test-key' \
            http://127.0.0.1:18080/v1/models | grep -q '"data"'

          management_code="$(curl -sS -o /tmp/fantom-management-unauthorized.json -w '%{http_code}' \
            http://127.0.0.1:18080/v0/management/config)"
          [[ "$management_code" == "401" ]]
          curl -fsS -H 'Authorization: Bearer ci-only-test-key' \
            http://127.0.0.1:18080/v0/management/config >/dev/null
          v8_code="$(curl -sS -o /tmp/fantom-v8-unauthorized.json -w '%{http_code}' \
            http://127.0.0.1:18080/v8/management/credentials)"
          [[ "$v8_code" == "401" ]]
          curl -fsS -H 'Authorization: Bearer ci-only-test-key' \
            'http://127.0.0.1:18080/v8/management/credentials?page=1&page_size=10' | grep -q '"files"'
          echo "Fantom gateway and embedded router smoke test passed"

  docker:
    name: Build and publish Docker image
    needs: [test, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub credentials
        id: dockerhub
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ( -n "$DOCKER_USERNAME" || -n "$DOCKERHUB_USERNAME" ) && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub secrets are missing; image will be built but not published."
          fi
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: monsmain/fantom
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.dockerhub.outputs.configured == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
